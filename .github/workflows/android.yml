name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add clean voice plugin
        run: |
          D=android/app/src/main/java/com/reelmaker/app
          cat > "$D/TtsFilePlugin.java" <<'EOF'
          package com.reelmaker.app;

          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;

          @CapacitorPlugin(name = "TtsFile")
          public class TtsFilePlugin extends Plugin {
              private TextToSpeech tts;
              private volatile boolean ready = false;

              @Override
              public void load() {
                  tts = new TextToSpeech(getContext(), new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          ready = (status == TextToSpeech.SUCCESS);
                      }
                  });
              }

              @PluginMethod
              public void getVoices(PluginCall call) {
                  JSArray arr = new JSArray();
                  try {
                      if (ready && tts != null) {
                          Set<Voice> vs = tts.getVoices();
                          if (vs != null) {
                              for (Voice v : vs) {
                                  JSObject o = new JSObject();
                                  o.put("name", v.getName());
                                  o.put("lang", v.getLocale().toLanguageTag());
                                  arr.put(o);
                              }
                          }
                      }
                  } catch (Exception e) {
                  }
                  JSObject r = new JSObject();
                  r.put("voices", arr);
                  call.resolve(r);
              }

              @PluginMethod
              public void synthesize(final PluginCall call) {
                  final String text = call.getString("text", "");
                  final String lang = call.getString("lang", "en-IN");
                  final String voiceName = call.getString("voiceName", "");
                  Float rateObj = call.getFloat("rate", 1.0f);
                  final float rate = rateObj == null ? 1.0f : rateObj.floatValue();
                  if (!ready || tts == null) {
                      call.reject("Text-to-speech is not ready. Check Android Settings.");
                      return;
                  }
                  try {
                      boolean chosen = false;
                      if (voiceName != null && voiceName.length() > 0) {
                          Set<Voice> vs = tts.getVoices();
                          if (vs != null) {
                              for (Voice v : vs) {
                                  if (v.getName().equals(voiceName)) {
                                      tts.setVoice(v);
                                      chosen = true;
                                      break;
                                  }
                              }
                          }
                      }
                      if (!chosen) {
                          tts.setLanguage(Locale.forLanguageTag(lang));
                      }
                      tts.setSpeechRate(rate);
                      final File out = new File(getContext().getCacheDir(), "tts-" + UUID.randomUUID().toString() + ".wav");
                      final String id = UUID.randomUUID().toString();
                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                          @Override
                          public void onStart(String utteranceId) {
                          }

                          @Override
                          public void onDone(String utteranceId) {
                              try {
                                  ByteArrayOutputStream bos = new ByteArrayOutputStream();
                                  FileInputStream in = new FileInputStream(out);
                                  byte[] chunk = new byte[16384];
                                  int n;
                                  while ((n = in.read(chunk)) > 0) {
                                      bos.write(chunk, 0, n);
                                  }
                                  in.close();
                                  JSObject r = new JSObject();
                                  r.put("data", Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                                  call.resolve(r);
                              } catch (Exception e) {
                                  call.reject("Could not read the voice file: " + e.getMessage());
                              } finally {
                                  out.delete();
                              }
                          }

                          @Override
                          public void onError(String utteranceId) {
                              out.delete();
                              call.reject("Voice creation failed.");
                          }
                      });
                      int res = tts.synthesizeToFile(text, null, out, id);
                      if (res != TextToSpeech.SUCCESS) {
                          call.reject("Voice creation could not start.");
                      }
                  } catch (Exception e) {
                      call.reject("Voice error: " + e.getMessage());
                  }
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.reelmaker.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TtsFilePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Allow microphone and text-to-speech
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' "$F"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-maker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
